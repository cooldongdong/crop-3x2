<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3:2 ⇄ 1.91:1</title>
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1d1d1b;
    --muted: #6b6a66;
    --line: #d9d7d0;
    --accent: #1d1d1b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe6; --muted: #9a9892; --line: #34332f; --accent: #ecebe6; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; border-radius: 6px; padding: 6px 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
  .modes { margin-bottom: 20px; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; min-height: 260px; padding: 24px;
    border: 1.5px dashed var(--line); border-radius: 12px;
    cursor: pointer; text-align: center; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  .drop strong { font-weight: 600; }
  .drop span { color: var(--muted); font-size: 14px; }

  .stage { display: none; }
  .has-image .drop { display: none; }
  .has-image .stage { display: block; }

  .frame { position: relative; line-height: 0; border-radius: 8px; overflow: hidden; }
  .frame img, .frame canvas { width: 100%; height: auto; display: block; }
  .cut {
    position: absolute; background: rgba(0,0,0,.55);
    background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.08) 6px 12px);
  }
  .keep { position: absolute; outline: 2px solid #fff; outline-offset: -1px; pointer-events: none; }
  .seam { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(255,255,255,.7); pointer-events: none; }
  .peek .seam { display: none; }
  #cropCanvas { display: none; }
  .mode-crop.peek #preview, .mode-crop.peek .cut, .mode-crop.peek .keep { display: none !important; }
  .mode-crop.peek #cropCanvas { display: block; }
  .mode-crop.peek .frame { max-width: var(--crop-w, 100%); margin: 0 auto; }

  /* 模式切換：crop 顯示 img＋遮罩，extend 顯示 canvas＋控制項 */
  #extendCanvas, .controls { display: none; }
  .mode-extend #preview, .mode-extend .cut, .mode-extend .keep { display: none; }
  .mode-extend #extendCanvas { display: block; }
  .mode-extend .controls { display: flex; }

  .controls { flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 16px; font-size: 14px; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls input[type=range] { width: 160px; accent-color: var(--accent); }
  .controls output { width: 2.5em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls .small { padding: 4px 10px; font-size: 13px; }
  .colors { display: flex; align-items: center; gap: 10px; }
  .colors .seg button { font-size: 13px; padding: 4px 10px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(127,127,127,.5); display: inline-block; }
  .colors input[type=color] { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
  .info { flex: 1; min-width: 200px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .info b { color: var(--fg); font-weight: 600; }
  button {
    font: inherit; font-size: 15px; padding: 9px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .note { color: var(--muted); font-size: 13px; margin-top: 28px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main id="app" class="mode-extend">
  <h1>3:2 ⇄ 1.91:1</h1>
  <p class="sub" id="sub"></p>

  <div class="seg modes" role="group" aria-label="模式">
    <button data-mode="extend" aria-pressed="true">延伸成 1.91:1</button>
    <button data-mode="crop" aria-pressed="false">裁成 3:2</button>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <strong>把照片拖進來，或點這裡選檔</strong>
    <span id="dropHint">也可以直接貼上（⌘V / Ctrl+V）</span>
  </label>

  <section class="stage">
    <div class="frame" id="frame">
      <img id="preview" alt="">
      <canvas id="extendCanvas"></canvas>
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="controls">
      <label>模糊 <input type="range" id="blur" min="0" max="100"> <output id="blurOut"></output></label>
      <label>接縫柔化 <input type="range" id="feather" min="0" max="100"> <output id="featherOut"></output></label>
      <label>暗角 <input type="range" id="vignette" min="0" max="100"> <output id="vignetteOut"></output></label>
      <div class="colors">
        <span>暗角顏色</span>
        <div class="seg" role="group" aria-label="暗角顏色">
          <button data-color="black" aria-pressed="true"><span class="swatch" style="background:#000"></span>黑色</button>
          <button data-color="dominant" aria-pressed="false"><span class="swatch" id="dominantSwatch"></span>圖片主色</button>
          <button data-color="custom" aria-pressed="false"><span class="swatch" id="customSwatch"></span>自訂</button>
        </div>
        <input type="color" id="customColor" value="#1d3557">
      </div>
      <button class="small" id="reset">回預設</button>
    </div>
    <div class="bar">
      <div class="info" id="info"></div>
      <button id="peek" aria-pressed="false">預覽（按住空白鍵）</button>
      <button id="again">換一張</button>
      <button class="primary" id="download">下載</button>
    </div>
  </section>

  <p class="note">照片不會離開你的電腦。輸出沿用原檔格式（JPG、PNG、WebP），其他格式會存成 PNG。</p>
</main>

<script>
const CROP_RATIO = 3 / 2;
const OG_RATIO = 1200 / 630;          // OG 圖標準比例，約 1.905
const DEFAULTS = { blur: 40, feather: 10, vignette: 100, color: 'black' };
const PREVIEW_MAX_H = 720;            // 預覽用縮小版算，下載才用原尺寸
const OUTPUT_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
const SUBTITLE = {
  crop: '置中裁成 3:2，只留中間。斜線區域會被切掉，按住空白鍵可以看裁好的樣子。',
  extend: '原圖完整放中間，左右用邊緣鏡像、模糊補滿成 1.91:1。虛線是原圖的邊界，按住空白鍵可以先藏起來。',
};

const $ = (id) => document.getElementById(id);
const app = $('app'), drop = $('drop'), fileInput = $('file');
const preview = $('preview'), frame = $('frame'), info = $('info');
const canvasEl = $('extendCanvas'), blurEl = $('blur'), featherEl = $('feather'), vignetteEl = $('vignette');
const customColorEl = $('customColor');

let mode = 'crop';
let colorChoice = DEFAULTS.color;
let current = null; // { file, img, url, dominant }

/* ---------- 共用 ---------- */

function blank(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

/* ---------- 裁成 3:2 ---------- */

// 置中裁成 3:2：太寬切左右，太高切上下
function centerCrop(w, h) {
  if (w / h > CROP_RATIO) {
    const cw = Math.round(h * CROP_RATIO);
    return { x: Math.floor((w - cw) / 2), y: 0, w: cw, h };
  }
  const ch = Math.round(w / CROP_RATIO);
  return { x: 0, y: Math.floor((h - ch) / 2), w, h: ch };
}

function renderCrop(img) {
  const c = centerCrop(img.naturalWidth, img.naturalHeight);
  const canvas = blank(c.w, c.h);
  canvas.getContext('2d').drawImage(img, c.x, c.y, c.w, c.h, 0, 0, c.w, c.h);
  return canvas;
}

/* ---------- 延伸成 1.91:1 ---------- */

function extendSize(w, h) {
  const outW = Math.round(h * OG_RATIO);
  return { outW, ext: Math.floor((outW - w) / 2) };
}

// 三次 box blur 近似高斯模糊；邊緣用最近的像素補
function boxBlur(data, w, h, r) {
  if (r < 1) return;
  const tmp = new Uint8ClampedArray(data.length);
  const pass = (src, dst, horizontal) => {
    const len = horizontal ? w : h, lines = horizontal ? h : w;
    const div = r * 2 + 1;
    for (let line = 0; line < lines; line++) {
      const idx = (i) => horizontal ? (line * w + i) * 4 : (i * w + line) * 4;
      for (let ch = 0; ch < 4; ch++) {
        let sum = 0;
        for (let i = -r; i <= r; i++) sum += src[idx(Math.min(len - 1, Math.max(0, i))) + ch];
        for (let i = 0; i < len; i++) {
          dst[idx(i) + ch] = sum / div;
          sum += src[idx(Math.min(len - 1, i + r + 1)) + ch] - src[idx(Math.max(0, i - r)) + ch];
        }
      }
    }
  };
  for (let k = 0; k < 3; k++) {
    pass(data, tmp, true);
    pass(tmp, data, false);
  }
}

function blurCanvas(canvas, blur) {
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const sigma = (blur / 100) * canvas.height * 0.06;
  boxBlur(img.data, canvas.width, canvas.height, Math.round(Math.sqrt(4 * sigma * sigma / 3 + 1) / 2));
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// 把原圖邊緣同寬的一條鏡像貼到外側；接縫兩邊的像素因此是連續的
function drawMirror(ctx, src, W, H, destX, width, side) {
  if (width <= 0) return;
  const sw = Math.min(width, W); // 原圖比延伸還窄時，拿整張去拉
  const sx = side === 'left' ? 0 : W - sw;
  ctx.save();
  ctx.translate(destX + width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(src, sx, 0, sw, H, 0, 0, width, H);
  ctx.restore();
}

// 圖片主色：縮小後把顏色分桶（每色 16 階），取最多的那一桶的平均色
function dominantColor(img) {
  const size = 64;
  const c = blank(size, size);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, size, size);
  const d = ctx.getImageData(0, 0, size, size).data;
  const buckets = new Map();
  for (let i = 0; i < d.length; i += 4) {
    const key = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
    const b = buckets.get(key) || [0, 0, 0, 0];
    b[0] += d[i]; b[1] += d[i + 1]; b[2] += d[i + 2]; b[3]++;
    buckets.set(key, b);
  }
  let best = null;
  for (const b of buckets.values()) if (!best || b[3] > best[3]) best = b;
  const hex = (v) => Math.round(v / best[3]).toString(16).padStart(2, '0');
  return '#' + hex(best[0]) + hex(best[1]) + hex(best[2]);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}

// 暗角：從最外側往內由深變淺，越過接縫、進到原圖裡約 10% 才消失
function drawVignette(ctx, W, H, ext, outW, strength, color) {
  if (strength <= 0) return;
  const [r, g, b] = hexToRgb(color);
  const a = (strength / 100) * 0.85;
  const reach = ext + W * 0.1;
  for (const [from, to] of [[0, reach], [outW, outW - reach]]) {
    const grad = ctx.createLinearGradient(from, 0, to, 0);
    grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(Math.min(from, to), 0, reach, H);
  }
}

// 底圖＝原圖＋兩側鏡像，整張一起模糊；原圖疊回中間時左右邊緣淡出，接縫才不會硬
// 最後疊暗角，把接縫藏進由深到淺的漸層裡
// src 可以是原圖或縮小過的預覽版；回傳完成的 canvas
function renderExtend(src, W, H, o) {
  const { outW, ext } = extendSize(W, H);
  const out = blank(outW, H);
  const ctx = out.getContext('2d');
  drawMirror(ctx, src, W, H, 0, ext, 'left');
  drawMirror(ctx, src, W, H, ext + W, outW - W - ext, 'right');
  ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
  blurCanvas(out, o.blur);

  const sharp = blank(W, H);
  const sctx = sharp.getContext('2d');
  sctx.drawImage(src, 0, 0, W, H);
  const t = Math.min(0.5, (o.feather / 100) * 0.4);
  if (t > 0) {
    const g = sctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(t, 'rgba(0,0,0,1)');
    g.addColorStop(1 - t, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.globalCompositeOperation = 'destination-in';
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(sharp, ext, 0);

  drawVignette(ctx, W, H, ext, outW, o.vignette, o.color);
  return { canvas: out, ext };
}

function previewSource(img) {
  const scale = Math.min(1, PREVIEW_MAX_H / img.naturalHeight);
  const W = Math.round(img.naturalWidth * scale), H = Math.round(img.naturalHeight * scale);
  const c = blank(W, H);
  c.getContext('2d').drawImage(img, 0, 0, W, H);
  return { src: c, W, H };
}

function vignetteColor() {
  if (colorChoice === 'dominant' && current) return current.dominant;
  if (colorChoice === 'custom') return customColorEl.value;
  return '#000000';
}

function effectOpts() {
  return { blur: +blurEl.value, feather: +featherEl.value, vignette: +vignetteEl.value, color: vignetteColor() };
}

/* ---------- 畫面 ---------- */

function refresh() {
  if (!current) return;
  const { img } = current;
  const W = img.naturalWidth, H = img.naturalHeight;
  const ratio = (W / H).toFixed(2);
  frame.querySelectorAll('.cut, .keep, .seam').forEach((el) => el.remove());

  if (mode === 'crop') {
    const c = centerCrop(W, H);
    drawCropOverlay(c, W, H);
    drawCropPreview(img, c);
    info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）→ <b>${c.w}×${c.h}</b>`;
    $('download').disabled = false;
    return;
  }

  if (extendSize(W, H).ext <= 0) {
    canvasEl.width = 0;
    preview.style.display = 'block';
    info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）已經是 1.91:1 或更寬，不用延伸。`;
    $('download').disabled = true;
    return;
  }
  preview.style.display = '';
  const p = previewSource(img);
  const { canvas, ext } = renderExtend(p.src, p.W, p.H, effectOpts());
  canvasEl.width = canvas.width;
  canvasEl.height = canvas.height;
  canvasEl.getContext('2d').drawImage(canvas, 0, 0);
  for (const x of [ext, ext + p.W]) {
    const s = document.createElement('div');
    s.className = 'seam';
    s.style.left = (x / canvas.width * 100) + '%';
    frame.appendChild(s);
  }
  info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）→ <b>${extendSize(W, H).outW}×${H}</b>`;
  $('download').disabled = false;
}

// 裁好的結果，給預覽用；縮小算，畫面上的寬度跟原圖預覽裡那塊一樣大
function drawCropPreview(img, c) {
  const scale = Math.min(1, PREVIEW_MAX_H / c.h);
  const cv = $('cropCanvas');
  cv.width = Math.round(c.w * scale);
  cv.height = Math.round(c.h * scale);
  cv.getContext('2d').drawImage(img, c.x, c.y, c.w, c.h, 0, 0, cv.width, cv.height);
  frame.style.setProperty('--crop-w', (c.w / img.naturalWidth * 100) + '%');
}

function drawCropOverlay(crop, W, H) {
  const pct = (v, t) => (v / t * 100) + '%';
  const add = (cls, l, t, w, h) => {
    const d = document.createElement('div');
    d.className = cls;
    Object.assign(d.style, { left: pct(l, W), top: pct(t, H), width: pct(w, W), height: pct(h, H) });
    frame.appendChild(d);
  };
  if (crop.x > 0) {
    add('cut', 0, 0, crop.x, H);
    add('cut', crop.x + crop.w, 0, W - crop.x - crop.w, H);
  }
  if (crop.y > 0) {
    add('cut', 0, 0, W, crop.y);
    add('cut', 0, crop.y + crop.h, W, H - crop.y - crop.h);
  }
  add('keep', crop.x, crop.y, crop.w, crop.h);
}

function setMode(m) {
  mode = m;
  app.classList.toggle('mode-crop', m === 'crop');
  app.classList.toggle('mode-extend', m === 'extend');
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('sub').textContent = SUBTITLE[m];
  refresh();
}

function setColor(choice) {
  colorChoice = choice;
  document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.color === choice));
  refresh();
}

function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    if (current) URL.revokeObjectURL(current.url);
    current = { file, img, url, dominant: dominantColor(img) };
    $('dominantSwatch').style.background = current.dominant;
    preview.src = url;
    app.classList.add('has-image');
    refresh();
  };
  img.onerror = () => { $('dropHint').textContent = '這個檔案讀不出來，換一張試試。'; };
  img.src = url;
}

function download() {
  const { file, img } = current;
  const canvas = mode === 'crop'
    ? renderCrop(img)
    : renderExtend(img, img.naturalWidth, img.naturalHeight, effectOpts()).canvas;

  const type = OUTPUT_TYPES.includes(file.type) ? file.type : 'image/png';
  const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[type];
  const base = (file.name || 'image').replace(/\.[^.]+$/, '');
  const suffix = mode === 'crop' ? '3x2' : '1.91x1';

  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${base}-${suffix}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, type, 0.95);
}

function syncOutputs() {
  $('blurOut').textContent = blurEl.value;
  $('featherOut').textContent = featherEl.value;
  $('vignetteOut').textContent = vignetteEl.value;
  $('customSwatch').style.background = customColorEl.value;
}

function applyDefaults() {
  blurEl.value = DEFAULTS.blur;
  featherEl.value = DEFAULTS.feather;
  vignetteEl.value = DEFAULTS.vignette;
  colorChoice = DEFAULTS.color;
  document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.color === colorChoice));
  syncOutputs();
}

/* ---------- 事件 ---------- */

document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => {
  setColor(b.dataset.color);
  if (b.dataset.color === 'custom') customColorEl.click(); // 「自訂」每次按都打開色盤
}));
customColorEl.addEventListener('input', () => { syncOutputs(); setColor('custom'); });

fileInput.addEventListener('change', () => load(fileInput.files[0]));
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
// 整頁都能接拖放，避免拖偏了瀏覽器直接打開圖片
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); load(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => {
  const item = [...e.clipboardData.items].find((i) => i.type.startsWith('image/'));
  if (item) load(item.getAsFile());
});

let pending = 0;
[blurEl, featherEl, vignetteEl].forEach((el) => el.addEventListener('input', () => {
  syncOutputs();
  cancelAnimationFrame(pending);
  pending = requestAnimationFrame(refresh);
}));
$('reset').addEventListener('click', () => {
  applyDefaults();
  refresh();
});

// 預覽：藏起虛線。按鈕切換；空白鍵按住時暫時隱藏、放開恢復
let peekLocked = false;
const setPeek = (on) => {
  app.classList.toggle('peek', on);
  $('peek').setAttribute('aria-pressed', on);
};
$('peek').addEventListener('click', () => { peekLocked = !peekLocked; setPeek(peekLocked); });
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault(); // 別讓空白鍵捲動頁面或按到聚焦中的按鈕
  if (!e.repeat) setPeek(true);
});
window.addEventListener('keyup', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  setPeek(peekLocked);
});

$('download').addEventListener('click', download);
$('again').addEventListener('click', () => {
  app.classList.remove('has-image');
  fileInput.value = '';
  fileInput.click();
});

applyDefaults();
setMode(location.hash === '#crop' ? 'crop' : 'extend');
</script>
</body>
</html>
