<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3:2 ⇄ 1.91:1</title>
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1d1d1b;
    --muted: #6b6a66;
    --line: #d9d7d0;
    --accent: #1d1d1b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe6; --muted: #9a9892; --line: #34332f; --accent: #ecebe6; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; margin-bottom: 20px; }
  .modes button { border: 0; border-radius: 6px; padding: 6px 14px; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; min-height: 260px; padding: 24px;
    border: 1.5px dashed var(--line); border-radius: 12px;
    cursor: pointer; text-align: center; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  .drop strong { font-weight: 600; }
  .drop span { color: var(--muted); font-size: 14px; }

  .stage { display: none; }
  .has-image .drop { display: none; }
  .has-image .stage { display: block; }

  .frame { position: relative; line-height: 0; border-radius: 8px; overflow: hidden; }
  .frame img, .frame canvas { width: 100%; height: auto; display: block; }
  .cut {
    position: absolute; background: rgba(0,0,0,.55);
    background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.08) 6px 12px);
  }
  .keep { position: absolute; outline: 2px solid #fff; outline-offset: -1px; pointer-events: none; }
  .peek .seam { display: none; }
  .seam { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(255,255,255,.7); pointer-events: none; }

  /* 模式切換：crop 顯示 img＋遮罩，extend 顯示 canvas＋滑桿 */
  #extendCanvas, .controls { display: none; }
  .mode-extend #preview, .mode-extend .cut, .mode-extend .keep { display: none; }
  .mode-extend #extendCanvas { display: block; }
  .mode-extend .controls { display: flex; }

  .controls { flex-wrap: wrap; gap: 8px 28px; margin-top: 16px; font-size: 14px; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls input[type=range] { width: 180px; accent-color: var(--accent); }
  .controls select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .controls output { width: 2.5em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls .reset { padding: 4px 10px; font-size: 13px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
  .info { flex: 1; min-width: 200px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .info b { color: var(--fg); font-weight: 600; }
  button {
    font: inherit; font-size: 15px; padding: 9px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .note { color: var(--muted); font-size: 13px; margin-top: 28px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main id="app" class="mode-crop">
  <h1>3:2 ⇄ 1.91:1</h1>
  <p class="sub" id="sub"></p>

  <div class="modes" role="group" aria-label="模式">
    <button data-mode="crop" aria-pressed="true">裁成 3:2</button>
    <button data-mode="extend" aria-pressed="false">延伸成 1.91:1</button>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <strong>把照片拖進來，或點這裡選檔</strong>
    <span id="dropHint">也可以直接貼上（⌘V / Ctrl+V）</span>
  </label>

  <section class="stage">
    <div class="frame" id="frame">
      <img id="preview" alt="">
      <canvas id="extendCanvas"></canvas>
    </div>
    <div class="controls">
      <label>模糊 <input type="range" id="blur" min="0" max="100"> <output id="blurOut"></output></label>
      <label>接縫做法
        <select id="method">
          <option value="feather">A 漸層融合</option>
          <option value="progressive">B 漸進模糊</option>
          <option value="stretch">C 邊緣拉伸</option>
          <option value="backdrop">E 整張模糊當背景</option>
          <option value="solid">F 單色漸層</option>
        </select>
      </label>
      <label id="featherRow">接縫柔化 <input type="range" id="feather" min="0" max="100"> <output id="featherOut"></output></label>
      <label>D 陰影 <input type="range" id="shadow" min="0" max="100"> <output id="shadowOut"></output></label>
      <label>暗角 <input type="range" id="vignette" min="0" max="100"> <output id="vignetteOut"></output></label>
      <button class="reset" id="reset">回預設</button>
      <button class="reset" id="peek" aria-pressed="false" title="按住空白鍵也可以">預覽（按住空白鍵）</button>
    </div>
    <div class="bar">
      <div class="info" id="info"></div>
      <button id="again">換一張</button>
      <button class="primary" id="download">下載</button>
    </div>
  </section>

  <p class="note">照片不會離開你的電腦。輸出沿用原檔格式（JPG、PNG、WebP），其他格式會存成 PNG。</p>
</main>

<script>
const CROP_RATIO = 3 / 2;
const OG_RATIO = 1200 / 630;          // OG 圖標準比例，約 1.905
const DEFAULTS = { method: 'feather', blur: 40, feather: 15, shadow: 0, vignette: 0 };
const PREVIEW_MAX_H = 720;            // 預覽用縮小版算，下載才用原尺寸
const OUTPUT_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
const SUBTITLE = {
  crop: '置中裁成 3:2，只留中間。斜線區域會被切掉。',
  extend: '原圖完整放中間，左右用邊緣鏡像、模糊補滿成 1.91:1。虛線是原圖的邊界，按住空白鍵可以先藏起來。',
};

const $ = (id) => document.getElementById(id);
const app = $('app'), drop = $('drop'), fileInput = $('file');
const preview = $('preview'), frame = $('frame'), info = $('info');
const canvasEl = $('extendCanvas'), blurEl = $('blur'), featherEl = $('feather'), shadowEl = $('shadow'), vignetteEl = $('vignette'), methodEl = $('method');

let mode = 'crop';
let current = null; // { file, img, url }

/* ---------- 裁成 3:2 ---------- */

// 置中裁成 3:2：太寬切左右，太高切上下
function centerCrop(w, h) {
  if (w / h > CROP_RATIO) {
    const cw = Math.round(h * CROP_RATIO);
    return { x: Math.floor((w - cw) / 2), y: 0, w: cw, h };
  }
  const ch = Math.round(w / CROP_RATIO);
  return { x: 0, y: Math.floor((h - ch) / 2), w, h: ch };
}

function renderCrop(img) {
  const c = centerCrop(img.naturalWidth, img.naturalHeight);
  const canvas = document.createElement('canvas');
  canvas.width = c.w;
  canvas.height = c.h;
  canvas.getContext('2d').drawImage(img, c.x, c.y, c.w, c.h, 0, 0, c.w, c.h);
  return canvas;
}

/* ---------- 延伸成 1.91:1 ---------- */

function extendSize(w, h) {
  const outW = Math.round(h * OG_RATIO);
  return { outW, ext: Math.floor((outW - w) / 2) };
}

// 三次 box blur 近似高斯模糊；邊緣用最近的像素補
function boxBlur(data, w, h, r) {
  if (r < 1) return;
  const tmp = new Uint8ClampedArray(data.length);
  const pass = (src, dst, horizontal) => {
    const len = horizontal ? w : h, lines = horizontal ? h : w;
    const div = r * 2 + 1;
    for (let line = 0; line < lines; line++) {
      const idx = (i) => horizontal ? (line * w + i) * 4 : (i * w + line) * 4;
      for (let ch = 0; ch < 4; ch++) {
        let sum = 0;
        for (let i = -r; i <= r; i++) sum += src[idx(Math.min(len - 1, Math.max(0, i))) + ch];
        for (let i = 0; i < len; i++) {
          dst[idx(i) + ch] = sum / div;
          sum += src[idx(Math.min(len - 1, i + r + 1)) + ch] - src[idx(Math.max(0, i - r)) + ch];
        }
      }
    }
  };
  for (let k = 0; k < 3; k++) {
    pass(data, tmp, true);
    pass(tmp, data, false);
  }
}

// 把原圖邊緣同寬的一條鏡像貼到外側；接縫兩邊的像素因此是連續的
function drawMirror(ctx, src, W, H, destX, width, side) {
  if (width <= 0) return;
  const sw = Math.min(width, W); // 原圖比延伸還窄時，拿整張去拉
  const sx = side === 'left' ? 0 : W - sw;
  ctx.save();
  ctx.translate(destX + width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(src, sx, 0, sw, H, 0, 0, width, H);
  ctx.restore();
}

function blurCanvas(canvas, blur) {
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const sigma = (blur / 100) * canvas.height * 0.06;
  boxBlur(img.data, canvas.width, canvas.height, Math.round(Math.sqrt(4 * sigma * sigma / 3 + 1) / 2));
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function blank(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

// 對 canvas 套水平方向的透明度遮罩；stops 是 [位置 0–1, 不透明度] 的清單
function maskX(canvas, stops) {
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, canvas.width, 0);
  for (const [pos, a] of stops) g.addColorStop(Math.min(1, Math.max(0, pos)), `rgba(0,0,0,${a})`);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
  return canvas;
}

// 原圖＋兩側鏡像（還沒模糊）
function mirrored(src, W, H, ext, outW) {
  const c = blank(outW, H);
  const ctx = c.getContext('2d');
  drawMirror(ctx, src, W, H, 0, ext, 'left');
  drawMirror(ctx, src, W, H, ext + W, outW - W - ext, 'right');
  ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
  return c;
}

// 四種接縫做法；都回傳完整的 outW×H 畫面（原圖已經疊好）
const METHODS = {
  // A 漸層融合：整張（原圖＋鏡像）一起模糊當底，原圖左右邊緣淡出疊回去
  feather(src, W, H, ext, outW, o) {
    const out = blurCanvas(mirrored(src, W, H, ext, outW), o.blur);
    const sharp = blank(W, H);
    sharp.getContext('2d').drawImage(src, 0, 0, W, H);
    const t = Math.min(0.5, (o.feather / 100) * 0.4);
    if (t > 0) maskX(sharp, [[0, 0], [t, 1], [1 - t, 1], [1, 0]]);
    out.getContext('2d').drawImage(sharp, ext, 0);
    return out;
  },
  // B 漸進模糊：原圖完全清楚；延伸區在接縫處是清楚的鏡像，越往外越糊
  progressive(src, W, H, ext, outW, o) {
    const out = blurCanvas(mirrored(src, W, H, ext, outW), o.blur);
    const sharp = mirrored(src, W, H, ext, outW);
    const l = ext / outW, r = (ext + W) / outW;
    maskX(sharp, [[0, 0], [l, 1], [r, 1], [1, 0]]);
    out.getContext('2d').drawImage(sharp, 0, 0);
    return out;
  },
  // C 邊緣拉伸：把原圖最邊緣一排像素往外拉成條紋，再模糊；原圖完全清楚
  stretch(src, W, H, ext, outW, o) {
    const out = blank(outW, H);
    const ctx = out.getContext('2d');
    ctx.drawImage(src, 0, 0, 1, H, 0, 0, ext, H);
    ctx.drawImage(src, W - 1, 0, 1, H, ext + W, 0, outW - W - ext, H);
    ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
    blurCanvas(out, o.blur);
    ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
    return out;
  },
  // F 單色漸層：每一列取原圖最邊緣的顏色，往外淡成整條邊的平均色；不會有鏡像的字或臉
  solid(src, W, H, ext, outW, o) {
    const s = blank(W, H);
    const sctx = s.getContext('2d');
    sctx.drawImage(src, 0, 0, W, H);
    const px = sctx.getImageData(0, 0, W, H).data;
    const edge = (x0, y) => {
      const c = [0, 0, 0];
      for (let x = x0; x < x0 + 3; x++) for (let k = 0; k < 3; k++) c[k] += px[(y * W + x) * 4 + k] / 3;
      return c;
    };
    const out = blank(outW, H);
    const ctx = out.getContext('2d');
    const img = ctx.createImageData(outW, H);
    const d = img.data;
    const sides = [
      { x0: 0, from: ext - 1, to: 0 },                         // 左：接縫在 ext-1，往左到 0
      { x0: Math.max(0, W - 3), from: ext + W, to: outW - 1 },  // 右：接縫在 ext+W，往右到底
    ];
    for (const side of sides) {
      const rows = [];
      const avg = [0, 0, 0];
      for (let y = 0; y < H; y++) {
        const c = edge(side.x0, y);
        rows.push(c);
        for (let k = 0; k < 3; k++) avg[k] += c[k] / H;
      }
      const len = Math.abs(side.to - side.from) || 1;
      const step = side.to >= side.from ? 1 : -1;
      for (let y = 0; y < H; y++) {
        for (let i = 0, x = side.from; i <= len; i++, x += step) {
          let t = i / len;
          t = t * t * (3 - 2 * t); // smoothstep，兩端比較柔
          const j = (y * outW + x) * 4;
          for (let k = 0; k < 3; k++) d[j + k] = rows[y][k] * (1 - t) + avg[k] * t;
          d[j + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    // 模糊前先把原圖放進中間，不然接縫會跟透明的像素混在一起、變成一條淡線
    ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
    blurCanvas(out, o.blur);
    ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
    return out;
  },
  // E 整張模糊當背景：整張圖放大鋪滿再模糊，原圖疊在中間
  backdrop(src, W, H, ext, outW, o) {
    const out = blank(outW, H);
    const ctx = out.getContext('2d');
    const scale = outW / W, bh = H * scale;
    ctx.drawImage(src, 0, (H - bh) / 2, outW, bh);
    blurCanvas(out, Math.max(o.blur, 20));
    ctx.drawImage(src, 0, 0, W, H, ext, 0, W, H);
    return out;
  },
};

// D 卡片陰影：接縫外側往外一段由深變淺，可以疊在任何做法上
function drawShadow(ctx, W, H, ext, outW, shadow) {
  if (shadow <= 0) return;
  const a = (shadow / 100) * 0.55, s = Math.min(ext, H * 0.08);
  const l = ctx.createLinearGradient(ext, 0, ext - s, 0);
  l.addColorStop(0, `rgba(0,0,0,${a})`);
  l.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = l;
  ctx.fillRect(ext - s, 0, s, H);
  const r = ctx.createLinearGradient(ext + W, 0, ext + W + s, 0);
  r.addColorStop(0, `rgba(0,0,0,${a})`);
  r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r;
  ctx.fillRect(ext + W, 0, s, H);
}

// 暗角：從最外側往內由深變淺，越過接縫、進到原圖裡約 10% 才消失
function drawVignette(ctx, W, H, ext, outW, vignette) {
  if (vignette <= 0) return;
  const a = (vignette / 100) * 0.85;
  const reach = ext + W * 0.1;
  const l = ctx.createLinearGradient(0, 0, reach, 0);
  l.addColorStop(0, `rgba(0,0,0,${a})`);
  l.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = l;
  ctx.fillRect(0, 0, reach, H);
  const r = ctx.createLinearGradient(outW, 0, outW - reach, 0);
  r.addColorStop(0, `rgba(0,0,0,${a})`);
  r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r;
  ctx.fillRect(outW - reach, 0, reach, H);
}

// src 可以是原圖或縮小過的預覽版；回傳完成的 canvas
function renderExtend(src, W, H, opts) {
  const { outW, ext } = extendSize(W, H);
  const out = METHODS[opts.method](src, W, H, ext, outW, opts);
  drawShadow(out.getContext('2d'), W, H, ext, outW, opts.shadow);
  drawVignette(out.getContext('2d'), W, H, ext, outW, opts.vignette);
  return { canvas: out, ext };
}

function previewSource(img) {
  const scale = Math.min(1, PREVIEW_MAX_H / img.naturalHeight);
  const W = Math.round(img.naturalWidth * scale), H = Math.round(img.naturalHeight * scale);
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  c.getContext('2d').drawImage(img, 0, 0, W, H);
  return { src: c, W, H };
}

/* ---------- 畫面 ---------- */

function canExtend() {
  const { img } = current;
  return extendSize(img.naturalWidth, img.naturalHeight).ext > 0;
}

function refresh() {
  if (!current) return;
  const { img } = current;
  const W = img.naturalWidth, H = img.naturalHeight;
  const ratio = (W / H).toFixed(2);
  frame.querySelectorAll('.cut, .keep, .seam').forEach((el) => el.remove());

  if (mode === 'crop') {
    const c = centerCrop(W, H);
    drawCropOverlay(c, W, H);
    info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）→ <b>${c.w}×${c.h}</b>`;
    $('download').disabled = false;
    return;
  }

  if (!canExtend()) {
    canvasEl.width = 0;
    preview.style.display = 'block';
    info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）已經是 1.91:1 或更寬，不用延伸。`;
    $('download').disabled = true;
    return;
  }
  preview.style.display = '';
  const p = previewSource(img);
  const { canvas, ext } = renderExtend(p.src, p.W, p.H, effectOpts());
  canvasEl.width = canvas.width;
  canvasEl.height = canvas.height;
  canvasEl.getContext('2d').drawImage(canvas, 0, 0);
  for (const x of [ext, ext + p.W]) {
    const s = document.createElement('div');
    s.className = 'seam';
    s.style.left = (x / canvas.width * 100) + '%';
    frame.appendChild(s);
  }
  const { outW } = extendSize(W, H);
  info.innerHTML = `原圖 ${W}×${H}（${ratio}:1）→ <b>${outW}×${H}</b>`;
  $('download').disabled = false;
}

function drawCropOverlay(crop, W, H) {
  const pct = (v, t) => (v / t * 100) + '%';
  const add = (cls, l, t, w, h) => {
    const d = document.createElement('div');
    d.className = cls;
    Object.assign(d.style, { left: pct(l, W), top: pct(t, H), width: pct(w, W), height: pct(h, H) });
    frame.appendChild(d);
  };
  if (crop.x > 0) {
    add('cut', 0, 0, crop.x, H);
    add('cut', crop.x + crop.w, 0, W - crop.x - crop.w, H);
  }
  if (crop.y > 0) {
    add('cut', 0, 0, W, crop.y);
    add('cut', 0, crop.y + crop.h, W, H - crop.y - crop.h);
  }
  add('keep', crop.x, crop.y, crop.w, crop.h);
}

function setMode(m) {
  mode = m;
  app.classList.toggle('mode-crop', m === 'crop');
  app.classList.toggle('mode-extend', m === 'extend');
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('sub').textContent = SUBTITLE[m];
  refresh();
}

function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    if (current) URL.revokeObjectURL(current.url);
    current = { file, img, url };
    preview.src = url;
    app.classList.add('has-image');
    refresh();
  };
  img.onerror = () => { $('dropHint').textContent = '這個檔案讀不出來，換一張試試。'; };
  img.src = url;
}

function download() {
  const { file, img } = current;
  const canvas = mode === 'crop'
    ? renderCrop(img)
    : renderExtend(img, img.naturalWidth, img.naturalHeight, effectOpts()).canvas;

  const type = OUTPUT_TYPES.includes(file.type) ? file.type : 'image/png';
  const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[type];
  const base = (file.name || 'image').replace(/\.[^.]+$/, '');
  const suffix = mode === 'crop' ? '3x2' : '1.91x1';

  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${base}-${suffix}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, type, 0.95);
}

function effectOpts() {
  return { method: methodEl.value, blur: +blurEl.value, feather: +featherEl.value, shadow: +shadowEl.value, vignette: +vignetteEl.value };
}

function syncOutputs() {
  $('blurOut').textContent = blurEl.value;
  $('featherOut').textContent = featherEl.value;
  $('shadowOut').textContent = shadowEl.value;
  $('vignetteOut').textContent = vignetteEl.value;
  // 接縫柔化只有 A 用得到
  $('featherRow').style.display = methodEl.value === 'feather' ? '' : 'none';
}

/* ---------- 事件 ---------- */

document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
fileInput.addEventListener('change', () => load(fileInput.files[0]));
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
// 整頁都能接拖放，避免拖偏了瀏覽器直接打開圖片
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); load(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => {
  const item = [...e.clipboardData.items].find((i) => i.type.startsWith('image/'));
  if (item) load(item.getAsFile());
});

let pending = 0;
[blurEl, featherEl, shadowEl, vignetteEl, methodEl].forEach((el) => el.addEventListener('input', () => {
  syncOutputs();
  cancelAnimationFrame(pending);
  pending = requestAnimationFrame(refresh);
}));
$('reset').addEventListener('click', () => {
  applyDefaults();
  refresh();
});

// 預覽：藏起虛線。按鈕切換；空白鍵按住時暫時隱藏、放開恢復
let peekLocked = false;
const setPeek = (on) => {
  app.classList.toggle('peek', on);
  $('peek').setAttribute('aria-pressed', on);
};
$('peek').addEventListener('click', () => { peekLocked = !peekLocked; setPeek(peekLocked); });
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.target.matches('input[type=text], textarea')) return;
  e.preventDefault(); // 別讓空白鍵捲動頁面或按到聚焦中的按鈕
  if (!e.repeat) setPeek(true);
});
window.addEventListener('keyup', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  setPeek(peekLocked);
});
$('download').addEventListener('click', download);
$('again').addEventListener('click', () => {
  app.classList.remove('has-image');
  fileInput.value = '';
  fileInput.click();
});

function applyDefaults() {
  blurEl.value = DEFAULTS.blur;
  featherEl.value = DEFAULTS.feather;
  shadowEl.value = DEFAULTS.shadow;
  vignetteEl.value = DEFAULTS.vignette;
  methodEl.value = DEFAULTS.method;
  syncOutputs();
}
applyDefaults();
setMode(location.hash === '#extend' ? 'extend' : 'crop');
</script>
</body>
</html>
